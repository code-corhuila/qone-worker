[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qone-worker"
version = "2.0.0"
description = "Worker of Qampus: outbox relay to RabbitMQ and scheduled jobs"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "psycopg[binary,pool]>=3.2,<4",
  "pika>=1.3,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# Domain errors are named after the contract codes (BusinessRuleViolation), not with a suffix.
ignore = ["N818"]
